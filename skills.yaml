# 第三方技能白名单；移除已接管条目后，sync 会卸载并保留备份。
# agent 默认同步全部清单技能及 Git 跟踪的自研技能。
agents:
  claude-code: ~/.claude/skills
  codex: ~/.codex/skills
  oh-my-pi: ~/.omp/agent/skills
  pi: ~/.pi/agent/skills
  opencode: ~/.config/opencode/skills

repositories:
  # 🛠️ 开发流程与编码规范

  # 规范驱动开发工具，将需求组织为提案、设计、实施任务和归档流程。
  https://github.com/Fission-AI/openspec:
    - openspec-apply-change
    - openspec-archive-change
    - openspec-continue-change
    - openspec-explore
    - openspec-ff-change
    - openspec-new-change
    - openspec-onboard
    - openspec-propose
    - openspec-sync-specs
    - openspec-update-change

  # 基于 Karpathy 编码经验的行为准则，减少过度设计和无关改动。
  https://github.com/multica-ai/andrej-karpathy-skills:
    - karpathy-guidelines

  # 🌐 浏览器自动化与调试

  # Playwright 浏览器自动化，用于页面测试、截图和响应式布局检查。
  https://github.com/lackeyjb/playwright-skill:
    - playwright-skill

  # 通过 Chrome 调试协议连接已有浏览器会话，检查页面、执行脚本和截图。
  https://github.com/pasky/chrome-cdp-skill:
    - chrome-cdp

  # 📝 文档写作与图表

  # 技术文档写作、设计提案与审校，统一结构、取舍说明和证据要求。
  https://github.com/riekelt/technical-writer:
    - technical-writing
    - writing-design-docs
    - reviewing-technical-prose

  # Mermaid 软件架构、流程和数据模型图解。
  https://github.com/softaworks/agent-toolkit:
    - mermaid-diagrams

  # Mermaid 图表渲染与美化，支持导出 SVG、PNG 和终端字符图。
  https://github.com/imxv/Pretty-mermaid-skills:
    - pretty-mermaid

  # 🧰 逆向分析与云端运维

  # REA 逆向分析工具，检查程序包、二进制、固件和应用运行行为。
  https://github.com/morluto/rea:
    - reverse-engineer-anything

  # Craft Anything 软件调查工具，分析已发布应用并记录可追溯证据。
  https://github.com/storytold/craft-anything:
    - craft-anything

  # 阿里云运维技能集，支持 ECS 远程命令、文件传输和端口转发。
  https://github.com/aliyun/alibabacloud-aiops-skills:
    - alibabacloud-workbench-cli

  # Cloudflare SaaS 开发，覆盖产品选型、Workers 规范和开发部署。
  https://github.com/cloudflare/skills:
    - cloudflare
    - workers-best-practices
    - wrangler

  # 🧩 技能发现与管理

  # Agent Skills 发现与管理工具，提供技能搜索、安装和更新能力。
  https://github.com/vercel-labs/skills:
    - find-skills

  # 🎨 UI 设计与品牌视觉

  # 通用 Agent 技能集合，涵盖前端视觉设计、文档处理等任务。
  https://github.com/anthropics/skills:
